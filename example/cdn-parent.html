<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDN 引入示例 - 父页面 (IframeClient)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f6fa;
        min-height: 100vh;
        padding: 24px;
      }
      .wrap { max-width: 900px; margin: 0 auto; }
      h1 { font-size: 20px; color: #2c3e50; margin-bottom: 4px; }
      .sub { font-size: 13px; color: #7f8c8d; margin-bottom: 16px; }
      .sub code {
        background: #eef1f6; padding: 2px 6px; border-radius: 4px;
        font-size: 12px; color: #4a69bd;
      }
      .panel {
        background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06);
        overflow: hidden; margin-bottom: 16px;
      }
      .panel-header {
        padding: 10px 16px; background: #2c3e50; color: #fff;
        font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #e74c3c; }
      .dot.online { background: #2ecc71; }
      #frame {
        width: 100%; height: 260px; border: none; display: block; background: #fff;
      }
      .log {
        padding: 12px 16px; font-family: 'SF Mono', Consolas, monospace;
        font-size: 12px; line-height: 1.8; color: #34495e; max-height: 240px; overflow-y: auto;
      }
      .log div { border-bottom: 1px dashed #ecf0f1; padding: 2px 0; }
      .log .time { color: #b2bec3; margin-right: 8px; }
      .log .ok { color: #27ae60; }
      .log .err { color: #e74c3c; }
      .btn-row { padding: 12px 16px; display: flex; gap: 10px; }
      button {
        padding: 8px 18px; border: none; border-radius: 8px; background: #4a69bd;
        color: #fff; font-size: 13px; cursor: pointer; transition: opacity .2s;
      }
      button:hover { opacity: .85; }
      button:disabled { background: #b2bec3; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🌐 CDN 直接引入示例（父页面）</h1>
      <p class="sub">
        通过 <code>&lt;script src="../dist/iframe-client.umd.min.js"&gt;</code> 直接引入，
        使用全局变量 <code>window.IframeClient</code>，无需任何打包器。
      </p>

      <div class="panel">
        <div class="panel-header">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">连接中...</span>
        </div>
        <iframe id="frame" src="./cdn-child.html"></iframe>
        <div class="btn-row">
          <button id="send-btn" disabled>发送消息给子页面</button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <!-- 方式一：直接引入本地构建产物（等价于 CDN 引入） -->
    <script src="../dist/iframe-client.umd.min.js"></script>
    <script>
      // 方式二（发布后）：从 CDN 引入
      // <script src="https://cdn.jsdelivr.net/npm/@giszhc/iframe-client@latest/dist/iframe-client.umd.min.js">

      // 全局变量：window.IframeClient（由 UMD 产物挂载）
      const { IframeClient } = window;

      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const sendBtn = document.getElementById('send-btn');
      const logEl = document.getElementById('log');

      function addLog(msg, type) {
        const time = new Date().toLocaleTimeString('en-US', { hour12: false });
        const div = document.createElement('div');
        div.innerHTML = `<span class="time">[${time}]</span><span class="${type}">${msg}</span>`;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
      }

      const client = new IframeClient({
        type: 'parent',
        iframe: document.getElementById('frame'),
        namespace: 'cdn-demo',
        targetOrigin: '*',
        onConnect: () => {
          statusDot.classList.add('online');
          statusText.textContent = '已连接子页面';
          sendBtn.disabled = false;
          addLog('✅ 握手完成，已与子页面建立连接', 'ok');
        },
        onError: (err) => {
          statusText.textContent = '连接错误';
          addLog('❌ 错误: ' + err.message, 'err');
        }
      });

      client.on('CHILD_REPLY', (data) => {
        addLog('📥 收到子页面回复: ' + (data?.text || JSON.stringify(data)));
      });

      sendBtn.addEventListener('click', () => {
        client.sendMessage('PARENT_HELLO', {
          text: '你好，子页面！',
          timestamp: new Date().toISOString()
        });
        addLog('📤 已发送 PARENT_HELLO', 'ok');
      });

      addLog('🚀 IframeClient 已通过 <script> 引入并初始化');
    </script>
  </body>
</html>
