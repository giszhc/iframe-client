<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDN 引入示例 - 子页面 (IframeClient)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fff;
        min-height: 100vh;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .badge {
        display: inline-block; padding: 4px 10px; border-radius: 20px;
        background: #eef1f6; color: #4a69bd; font-size: 12px; font-weight: 600;
        width: fit-content;
      }
      .card {
        border: 1px solid #ecf0f1; border-radius: 10px; padding: 14px;
        font-size: 13px; color: #34495e; line-height: 1.7;
      }
      .card strong { color: #2c3e50; }
      .card .reply { margin-top: 6px; color: #27ae60; }
      #hint { color: #b2bec3; font-size: 12px; }
    </style>
  </head>
  <body>
    <span class="badge">子页面（iframe 内）</span>
    <div class="card">
      <strong id="state">⏳ 等待与父页面建立连接...</strong>
    </div>
    <div class="card">
      最近收到的消息：
      <div id="last-msg">-</div>
    </div>
    <div id="hint">本页面同样通过 &lt;script&gt; 直接引入 iframe-client 库</div>

    <!-- 与父页面相同的方式直接引入库 -->
    <script src="../dist/iframe-client.umd.min.js"></script>
    <script>
      const { IframeClient } = window;

      const stateEl = document.getElementById('state');
      const lastMsgEl = document.getElementById('last-msg');

      const client = new IframeClient({
        type: 'child',
        targetWindow: window.parent,
        namespace: 'cdn-demo', // 必须与父页面一致
        onConnect: () => {
          stateEl.textContent = '✅ 已与父页面建立连接';
        },
        onError: (err) => {
          stateEl.textContent = '❌ 错误: ' + err.message;
        }
      });

      // 收到父页面消息后自动回复
      client.on('PARENT_HELLO', (data) => {
        lastMsgEl.textContent = JSON.stringify(data);
        client.sendMessage('CHILD_REPLY', {
          text: '你好，父页面！我已收到消息 👋',
          timestamp: new Date().toISOString()
        });
      });
    </script>
  </body>
</html>
