name: Deploy to GitHub Pages

on:
  # 推送到 master 分支时自动构建并部署
  push:
    branches: [master]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

# 赋予 GitHub Actions 部署到 Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新的会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本地 pnpm 11 保持一致（lockfile 为 9.0 格式，pnpm 9 无法解析）
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 已被 runner 弃用，使用 22 LTS
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build

      - name: Build example site
        run: pnpm run build:example

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
